remotes:
  - git_url: https://github.com/eirvandelden/dotfiles.git
    ref: main
    refetch_frequency: 24h
    configs:
      - lefthook.yml

pre-push:
  commands:
    # The shared minitest job only maps app/X.rb to test/X_test.rb. This job runs the branch's
    # changed test files themselves, engine tests included, from the shared hook-level `files:`
    # list (not {push_files}, which lists every file on a first push). Not named minitest: the
    # remote config overrides a repo job of the same name.
    minitest-changed-tests:
      tags:
        - ruby
        - tests
        - minitest
      glob:
        - "test/*_test.rb"
        - "test/**/*_test.rb"
        - "engines/*/test/*_test.rb"
        - "engines/*/test/**/*_test.rb"
      # GIT_DIR is unset for the reason given on the shared pre-commit rubocop job.
      run: |
        unset GIT_DIR
        bin/rails test {files}
      fail_text: |
        Tests failed for pushed test files.
        Fix the failing tests or use `--no-verify` to skip.
