# Development and production both run the app in more than one process — see
# Procfile.dev and config/deploy.yml — so in both a broadcast has to reach
# past the process that sent it.
default: &default
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

development:
  <<: *default

test:
  adapter: async

production:
  <<: *default
