---
# The rules shared by every personal Ruby project, plus the Rails layer.
inherit_gem:
  rubocop-eirvandelden:
    - config/default.yml
    - config/rails.yml

inherit_from:
  - .rubocop_todo.yml

# Every inherited Exclude adds to the list rather than replacing it. Without this the todo
# file's own exclusions would drop the shared ones, bringing Metrics/BlockLength back for
# routes and environment files.
inherit_mode:
  merge:
    - Exclude

AllCops:
  TargetRubyVersion: 3.4
